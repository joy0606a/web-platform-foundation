name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same checks that run locally, enforced for every push and PR so
      # quality holds no matter who is contributing.
      - run: pnpm run lint
      - run: pnpm run check-types
      - run: pnpm run build
      - run: pnpm test

      # Deterministic harness contract tests: prove the Claude Code plugin
      # (agents/skills frontmatter + hook behavior) is structurally valid and
      # behaves as specified. Hermetic, no LLM calls. The probabilistic LLM
      # evals (evals/) are intentionally NOT run here — see evals/README.md.
      - run: pnpm test:harness

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          CI: true
