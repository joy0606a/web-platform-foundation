name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Scans the full history (and the PR diff) for committed secrets. This is the
  # hard gate; the local pre-commit hook is fast feedback for those who have
  # gitleaks installed, but CI catches it for everyone.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fails the build on known high-severity advisories in production dependencies.
  # Pairs with pnpm's frozen lockfile and strict store (see ADR 0002) to keep the
  # supply chain honest.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
